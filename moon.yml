project:
    name: etl-design
    description: project root

id: source

tasks:
    run-parsers:
        command: noop
        deps:
            - formula-parser:run
            - ddl-generator:run
            - sql-builder:run
            - excel-reader:run
        preset: server

    deploy-mongo:
        command: sh
        args:
            - scripts/deploy_mongo_docker.sh
        options:
            cache: false

    deploy-postgres:
        command: sh
        args:
            - scripts/deploy_postgres_docker.sh
        options:
            cache: false

    deploy-rabbit:
        command: sh
        args:
            - scripts/deploy_rabbitmq_docker.sh
        options:
            cache: false

    deploy-redis:
        command: sh
        args:
            - scripts/deploy_redis_docker.sh
        options:
            cache: false

    development:
        command: noop
        deps:
            - source:run-parsers
            - source:deploy-postgres
            - source:deploy-mongo
            - source:deploy-redis
            - database:run
            - api:run
            - web:dev
        preset: server
        options:
            runDepsInParallel: true
