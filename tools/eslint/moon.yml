project:
    name: eslint
    description: shared eslint config for etl-design packages

tasks:
    pnpm:
        command: pnpm
        args:
            - --filter
            - "@sloth/tools-eslint"
        toolchains: node
        options:
            runFromWorkspaceRoot: true
            cache: false

    build:
        command: pnpm
        args:
            - exec
            - tsup
        toolchains: node
