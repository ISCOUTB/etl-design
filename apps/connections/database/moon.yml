project:
    name: Database Connections
    description: |
        A Python gRPC service that manages database 
        connections and schema versions for various databases (MongoDB and Redis), 
        including MongoDB, Redis, and SQL databases. This service 
        handles the storage, retrieval, and versioning of database 
        schemas, ensuring that applications can interact with 
        databases using the correct schema definitions.

layer: application

language: python

tasks:
    run:
        command: uv
        args:
            - run
            - python
            - -m
            - src.server
        toolchains: python
        preset: server

    test:
        command: uv
        args:
            - run
            - pytest
            - -v
            - -n
            - "0"
            - --cov=src
            - --cov-report=term-missing
            - --cov-report=html
            - --cov-report=xml
        toolchains: python
        options:
            cache: false

    format:
        command: uv
        args:
            - run
            - ruff
            - format
            - .
        toolchains: python

    docker-build:
        command: docker
        args:
            - build
            - -f
            - apps/connections/database/Dockerfile
            - .
        toolchains: system
        options:
            runFromWorkspaceRoot: true
