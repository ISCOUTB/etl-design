project:
    name: typechecking
    description: |
        A high-performance, enterprise-grade data 
        validation system designed for ETL processes 
        that validates spreadsheet files (CSV, XLSX, XLS) 
        against JSON schemas using parallel processing, 
        message queuing, and modern distributed architecture 
        patterns.

layer: application

language: python

tasks:
    test:
        command: uv
        args:
            - run
            - pytest
            - -n
            - auto
            - --cov=src
            - --cov-report=term-missing
            - --cov-report=html
            - --cov-report=xml
        toolchains: python

    uv:
        command: uv
        toolchains: python
        options:
            cache: false

    format:
        command: uv
        args:
            - run
            - ruff
            - format
            - .
        toolchains: python

    run:
        command: uv
        args:
            - run
            - python
            - -m
            - src.main
        toolchains: python
        preset: server

    server:
        command: uv
        args:
            - run
            - -m
            - src.minimal_server
        toolchains: python
        preset: server

    docker-build:
        command: docker
        args:
            - build
            - -f
            - apps/backend/typechecking/Dockerfile
            - .
        options:
            runFromWorkspaceRoot: true
            cache: false
