project:
    name: api
    description: api layer service

type: application

language: python

toolchain:
    python:

tasks:
    uv:
        command: uv
        toolchain: python
        options:
            runFromWorkspaceRoot: false
            cache: false

    run:
        deps:
            - prestart
        command: uv
        args:
            - run
            - python
            - -m
            - src.main
        toolchain: python
        local: true
        options:
            runFromWorkspaceRoot: false

    format:
        command: uv
        args:
            - run
            - ruff
            - format
            - .
        options:
            runFromWorkspaceRoot: false

    test:
        command: echo "No tests defined"

    prestart:
        command: bash
        args:
            - scripts/prestart.sh
        local: true
        options:
            runFromWorkspaceRoot: false
            cache: false

    docker-build:
        command: docker
        args:
            - build
            - -f
            - ./apps/backend/api/Dockerfile
            - .
        options:
            runFromWorkspaceRoot: true
