project:
    name: api
    description: api layer service

layer: application

language: python

tasks:
    uv:
        command: uv
        toolchains: python
        options:
            cache: false

    run:
        deps:
            - prestart
        command: uv
        args:
            - run
            - python
            - -m
            - src.main
        toolchains: python
        preset: server

    format:
        command: uv
        args:
            - run
            - ruff
            - format
            - .
        toolchains: python

    test:
        script: echo "No tests defined"

    prestart:
        command: bash
        args:
            - scripts/prestart.sh
        toolchains: system
        options:
            cache: false

    docker-build:
        command: docker
        args:
            - build
            - -f
            - ./apps/backend/api/Dockerfile
            - .
        toolchains: system
        options:
            runFromWorkspaceRoot: true
