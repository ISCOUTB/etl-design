[project]
name = "sql-builder"
version = "0.1.0"
description = "A Python gRPC service that constructs SQL DDL statements from individual DDL expressions and column metadata. This service assembles CREATE TABLE and dependency-ordered ALTER TABLE statements for generated columns."
readme = "README.md"
requires-python = "==3.12.10"
dependencies = [
    "proto-utils",
    "asyncio>=3.4.3",
    "igraph>=1.0.0",
    "pydantic-settings>=2.13.1",
    "watchfiles>=1.1.1",
    "py-async-grpc-prometheus>=0.2.0",
    "opentelemetry-instrumentation-grpc>=0.61b0",
    "opentelemetry-sdk>=1.40.0",
    "opentelemetry-exporter-otlp-proto-http>=1.40.0",
    "python-json-logger>=4.0.0",
]

[tool.uv.sources]
proto-utils = { path = "../../../../packages/proto-utils/proto-utils-py", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-sugar>=1.1.1",
    "pytest-xdist>=3.8.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.6",
]

[tool.pytest.ini_options]
pythonpath = [
    "src"
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 80
target-version = "py312"
lint.extend-select = ["I"]
