project:
    name: sql-builder
    description: |
        A Python gRPC service that constructs SQL DDL statements from individual
        DDL expressions and column metadata. This service assembles CREATE TABLE
        and dependency-ordered ALTER TABLE statements for generated columns.

layer: application

language: python

tasks:
    test:
        command: uv
        args:
            - run
            - -m
            - pytest
            - -v
            - -n
            - auto
            - --cov=src
            - --cov-report=term-missing
            - --cov-report=html
            - --cov-report=xml
        toolchains: python

    uv:
        command: uv
        toolchains: python
        options:
            cache: false

    run:
        command: uv
        args:
            - run
            - python
            - -m
            - src.server
        toolchains: python
        preset: server

    docker-build:
        command: docker
        args:
            - build
            - -f
            - ./apps/backend/parsers/sql-builder/Dockerfile
            - .
        toolchains: system
        options:
            runFromWorkspaceRoot: true
