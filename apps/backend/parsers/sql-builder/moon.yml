project:
    name: sql-builder
    description: |
        A Python gRPC service that constructs complete 
        SQL statements from individual DDL expressions and 
        column metadata. This service is responsible for 
        assembling final CREATE TABLE and INSERT statements 
        by managing dependencies and execution order of 
        SQL expressions.

layer: application

language: python

tasks:
    test:
        command: uv
        args:
            - run
            - pytest
            - -v
            - -n
            - auto
            - --cov=src
            - --cov-report=term-missing
            - --cov-report=html
            - --cov-report=xml
        toolchains: python

    uv:
        command: uv
        toolchains: python
        options:
            cache: false

    run:
        command: uv
        args:
            - run
            - python
            - -m
            - src.server
        toolchains: python
        preset: server

    docker-build:
        command: docker
        args:
            - build
            - -f
            - ./apps/backend/parsers/sql-builder/Dockerfile
            - .
        options:
            runFromWorkspaceRoot: true
