project:
    name: Excel-Reader
    description: |
        A FastAPI-based REST service that serves as 
        the main entry point for the Excel Parsing system. 
        This service processes Excel files, extracts formulas 
        and data, and orchestrates communication with other 
        microservices to generate SQL statements.

layer: application

language: python

tasks:
    test:
        command: uv
        args:
            - run
            - -m
            - pytest
            - -v
            - -n
            - auto
            - --cov=src
            - --cov-report=term-missing
            - --cov-report=html
            - --cov-report=xml
        toolchains: python

    uv:
        command: uv
        toolchains: python
        options:
            cache: false

    run:
        command: uv
        args:
            - run
            - python
            - -m
            - src.server_rest
        toolchains: python
        preset: server

    docker-build:
        command: docker
        args:
            - build
            - -f
            - ./apps/backend/parsers/excel-reader/Dockerfile
            - .
        options:
            runFromWorkspaceRoot: true
