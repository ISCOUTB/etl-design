project:
    name: web
    description: web side application for end-users

layer: application

language: typescript

tasks:
    pnpm:
        command: pnpm
        args:
            - --filter
            - "@sloth/apps-web"
        toolchains: node
        options:
            runFromWorkspaceRoot: true
            cache: false

    nuxt:
        command: npx
        args:
            - nuxt@latest
        toolchains: node
        preset: server

    shadcn:
        command: npx
        args:
            - shadcn-vue@latest
        toolchains: node

    docker-build:
        command: docker
        args:
            - build
            - -f
            - apps/web/Dockerfile
            - .
        options:
            runFromWorkspaceRoot: true
            cache: false
