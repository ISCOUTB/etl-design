project:
    name: proto-utils-js
    description: |
        Shared utilities for working with protobufs in 
        JavaScript/TypeScript projects.

layer: library

tasks:
    generate:
        command: bash ./scripts/generate.sh
        options:
            cache: false

    pnpm:
        command: pnpm
        args:
            - --filter
            - "@sloth/packages-proto-utils-js"
        options:
            runFromWorkspaceRoot: true
            cache: false

    prepare:
        command: noop
        deps:
            - eslint:build

    build:
        command: pnpm
        args:
            - exec
            - tsup
        deps:
            - ^:generate
