project:
    name: autoscaler
    description: AutoScaler utility for deployment

layer: tool

language: python

tasks:
    uv:
        command: uv
        toolchain: python

    run:
        command: uv
        args:
            - run
            - -m
            - src.main
        env:
            PYTHONPATH: .
        toolchains: python
        options:
            runFromWorkspaceRoot: false

    docker-build:
        command: docker
        args:
            - build
            - -t
            - autoscaler:latest
            - -f
            - Dockerfile
            - .
        options:
            runFromWorkspaceRoot: false
            cache: false
