apiVersion: 1

deleteDatasources:
  - name: Prometheus
    orgId: 1
  - name: Tempo
    orgId: 1
  - name: Loki
    orgId: 1

prune: true

datasources:
  - name: Prometheus
    orgId: 1
    version: 1
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    basicAuth: false
    isDefault: true
    editable: false
    jsonData:
      httpMethod: GET

  - name: Tempo
    orgId: 1
    version: 1
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    basicAuth: false
    isDefault: false
    editable: false
    jsonData:
      httpMethod: GET
      serviceMap:
        datasourceUid: prometheus
      streamingEnabled:
        search: false
        metrics: false

  - name: Loki
    orgId: 1
    version: 1
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    basicAuth: false
    isDefault: false
    editable: false
    jsonData:
      httpMethod: GET
      derivedFields:
        - datasourceName: Tempo
          datasourceUid: tempo
          matcherRegex: "trace_id=([\\w-]+)"
          name: trace_id
          url: "$${__value.raw}"
