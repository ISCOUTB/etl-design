name: CI - Formula Parser Tests
on:
    pull_request:
        branches:
            - main
            - staging
            - development
        paths:
            - apps/backend/parsers/formula-parser/**
            - packages/proto-utils/proto-utils-js/**
            - tools/eslint/**
            - tools/tsconfig/**
            - .github/workflows/ci-formula-parser-tests.yml

jobs:
    tests:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Enable corepack for pnpm
              run: corepack enable

            - name: Install Node dependencies
              run: pnpm install --frozen-lockfile --ignore-scripts

            - name: Run tests
              uses: ./.github/actions/run-unit-tests
              with:
                  service_name: "formula-parser"
                  env_example_file: "apps/backend/parsers/formula-parser/.env.example"

            - name: Build Docker Image
              uses: ./.github/actions/build-docker-image
              with:
                  service_name: formula-parser
                  verify_image: true
                  push_image: false
